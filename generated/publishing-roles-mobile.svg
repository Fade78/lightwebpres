<g transform="translate(54 179)" fill="none" stroke="#0e2a43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 5 1 H 19 L 27 9 V 29 H 5 Z M 19 1 V 9 H 27 M 10 15 H 22 M 10 21 H 22"/></g>
<text x="50" y="239" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Document architects</text>
<text x="50" y="273" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Articles, order, tags, languages</text>
<text x="50" y="302" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">series.json: series config</text>
</g>
