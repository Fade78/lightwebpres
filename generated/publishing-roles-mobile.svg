<text x="32" y="1894" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Commons is a collection, not an identity.</text>
<text x="32" y="1924" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">People or agents can fill these roles.</text>
<text x="32" y="1954" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Hosting is a separate step.</text>
