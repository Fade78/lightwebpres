<text x="50" y="1553" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Presenters</text>
<text x="50" y="1587" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Navigate and zoom;</text>
