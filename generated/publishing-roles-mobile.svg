<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1990" viewBox="0 0 600 1990" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">More roles, one build</title>
<desc id="diagram-desc">Document architects configure content and series.json; theme and kit makers supply selected appearance resources. Kit compose selects files into a self-contained kit with own or builtin references, not live dependencies on other kits. Integrators orchestrate builds and check outputs. Solid arrows carry resources or results; dashed arrows denote orchestration. A configured LightWebPres build produces HTML and assets for readers, presenters and publishers. Browser printing can produce PDF; publishing and hosting are separate actions. People or external agents can fill these roles. Commons is a collection, not an identity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#167d8d"/></marker></defs>
<rect x="0" y="0" width="600" height="1990" rx="0" fill="#f7f4ec" stroke="none" stroke-width="2"/>
<text x="32" y="50" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0e2a43">More roles, one build</text>
<text x="32" y="86" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Solid: resources / results</text>
<text x="32" y="116" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Dashed: build orchestration</text>
<path data-from="architects" data-to="configured-build" data-kind="resource" d="M 512 243.0 L 552 243.0 L 552 1062 L 520 1062" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="makers" data-to="configured-build" data-kind="resource" d="M 512 502.0 L 552 502.0 L 552 1062 L 520 1062" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="integrators" data-to="configured-build" data-kind="orchestration" d="M 272 862 L 272 936" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="configured-build" data-to="readers" data-kind="resource" d="M 300 1188 L 300 1224 L 552 1224 L 552 1342.0 L 512 1342.0" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="configured-build" data-to="presenters" data-kind="resource" d="M 300 1188 L 300 1224 L 552 1224 L 552 1554.0 L 512 1554.0" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="configured-build" data-to="publishers" data-kind="resource" d="M 300 1188 L 300 1224 L 552 1224 L 552 1766.0 L 512 1766.0" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
