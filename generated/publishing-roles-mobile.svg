<text x="50" y="457" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Theme &amp; kit makers</text>
<text x="50" y="491" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Themes, layouts, presets</text>
<text x="50" y="520" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">kit compose: selected files</text>
<text x="50" y="549" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">into a self-contained kit.</text>
<text x="50" y="578" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">Own or builtin references;</text>
<text x="50" y="607" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">no live links to other kits.</text>
</g>
