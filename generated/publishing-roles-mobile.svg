<text x="50" y="757" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0e2a43">Integrators</text>
<text x="50" y="791" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">People or external agents</text>
<text x="50" y="820" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">run CLI / CI / browser builds</text>
<text x="50" y="849" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0e2a43">and check outputs.</text>
